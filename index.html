<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal Money Manager</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#060f0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money Manager">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 1. COLOURS: change these to restyle the whole app */
:root{--bg:#060f0b;--sf:#0d1a14;--ln:#1c3328;--tx:#eafff3;--mu:#8fb09f;--g:#22e06b;--r:#ef4444;--y:#f5b53b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Poppins,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input,select{background:#0a150f;border:1px solid var(--ln);border-radius:10px;padding:10px 12px;width:100%}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:#08130e;border-right:1px solid var(--ln);padding:20px 12px;position:sticky;top:0;height:100vh}
.brand{text-align:center;font-size:1.1rem;line-height:1.2;margin-bottom:22px}
.brand span{font-size:2.2rem;display:block}
nav{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:12px;padding:11px 14px;text-align:left;font-size:.95rem}
nav button.on{background:var(--g);color:#04210f;font-weight:600}
main{padding:20px;min-width:0}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:1.6rem;margin:0;line-height:1.2}
header p{margin:2px 0 0;color:var(--mu)}
.hr{display:flex;gap:8px}.hr input{width:auto}
.hr button{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:0 14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:1.05rem;margin:0 0 10px}
.hd{display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.stats .card{margin:0}
.stat small{color:var(--mu);display:block}
.stat b{font-size:1.7rem;font-weight:700}
.stat.in{background:#0b2418}.stat.out{background:#2a1111;border-color:#4a1f1f}.stat.bal{background:#0c2b1b}
.g{color:var(--g)}.r{color:var(--r)}.mu{color:var(--mu)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols>div{min-width:0}
.bud .big{font-size:2.2rem;font-weight:700;color:var(--g);line-height:1.1}
.bud.warn .big{color:var(--y)}.bud.over .big{color:var(--r)}
.bar{height:16px;background:#16281f;border-radius:99px;overflow:hidden;margin:10px 0 6px;flex:1}
.bar i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .3s}
.warn .bar i{background:var(--y)}.over .bar i{background:var(--r)}
.bud .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mu);font-size:.85rem}
.bud input{width:110px;padding:6px 10px}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:3px}
.dow{color:var(--mu);font-size:.8rem;margin:8px 0 4px}
.day{background:none;border:0;border-radius:10px;min-height:46px;padding:4px 0;display:flex;flex-direction:column;align-items:center}
.day.now{border:1px solid var(--g)}
.day.sel{background:var(--g);color:#04210f;font-weight:700}
.day span{display:flex;gap:3px;height:8px}
.day b{width:6px;height:6px;border-radius:50%;background:var(--g)}.day b.r{background:var(--r)}
.legend{display:flex;gap:14px;justify-content:center;font-size:.8rem;color:var(--mu);margin-top:8px}
.pri{background:var(--g);color:#04210f;border:0;border-radius:12px;padding:12px;font-weight:600;width:100%;margin-top:10px}
.pri.sm,.ghost.sm{width:auto;margin:0;padding:6px 14px}
.ghost{background:none;border:1px solid var(--ln);border-radius:12px;padding:12px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.acts button{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 4px;font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:4px}
.acts span{font-size:1.5rem}
.ov{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}
.ov span{font-size:1.5rem;display:block}.ov small{display:block;color:var(--mu)}.ov b{font-size:.95rem}
.tx{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln)}
.tx>div{flex:1;min-width:0}.tx small{display:block;color:var(--mu);font-size:.78rem}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#2a1830;flex:none}
.ic.income{background:var(--g);color:#04210f}
.chip{font-size:.7rem;border:1px solid var(--ln);border-radius:99px;padding:0 8px;color:var(--mu)}
.x{background:none;border:0;color:var(--mu);font-size:1.2rem;width:32px;height:32px}
.ll{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ll button{text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px}
.ll small{display:block;color:var(--mu)}.ll b{font-size:1.2rem}
.row2{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}
.row2>div{flex:1}.row2 small{display:block;color:var(--mu)}.done{opacity:.5;text-decoration:line-through}
.rep{display:flex;align-items:center;gap:10px;padding:6px 0}.rep span{width:120px}
.crow{display:flex;gap:8px;margin:6px 0}.crow .ce{width:64px;text-align:center}.crow .cn{flex:1}
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}#auth.off{display:none}
#auth .card{width:min(100%,380px)}#auth .brand{margin-bottom:12px}#auth label{display:block;margin:10px 0;color:var(--mu);font-size:.85rem}
#a-msg{color:var(--r);min-height:1.4em;margin:6px 0 0}.lnk{background:none;border:0;color:var(--g);padding:4px 0;text-decoration:underline}
.tabs{display:flex;gap:10px;margin-bottom:12px}.tabs button{flex:1;margin:0}
.stats2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.stats2 small{display:block;color:var(--mu)}.stats2 b{font-size:1.2rem}
.chart{position:relative;display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--ln)}
.chart i{flex:1;background:var(--g);border-radius:3px 3px 0 0}.chart i.o{background:var(--r)}
.chart u{position:absolute;left:0;right:0;border-top:2px dashed var(--y);pointer-events:none}.cap{font-size:.8rem;margin-top:6px}
.mon .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mu);font-size:.85rem;flex-wrap:wrap}.mon input{width:120px;padding:6px 10px}
@media(min-width:700px){.stats2{grid-template-columns:repeat(4,1fr)}}
.acts3{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.ghost.invln{width:100%;margin-top:12px}
.chk{display:flex;align-items:center;gap:10px}.chk input{width:auto}
dialog{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:18px;width:min(92vw,400px);padding:20px}
dialog::backdrop{background:#000a}
dialog label{display:block;margin:10px 0;color:var(--mu);font-size:.85rem}
dialog .row{display:flex;gap:10px}dialog .row button{flex:1;margin:0}
#f-err{color:var(--r);min-height:1.4em;margin:6px 0 0}
@media(max-width:899px){
 .app{grid-template-columns:1fr}
 aside{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:5;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--ln)}
 .brand,.soon{display:none}
 nav{flex-direction:row}nav button{flex:1;flex-direction:column;gap:0;padding:6px 2px;font-size:.68rem;text-align:center}
 main{padding:calc(16px + env(safe-area-inset-top,0px)) 14px 100px}
 .cols{grid-template-columns:1fr}
}
@media(max-width:699px){.stats{grid-template-columns:1fr 1fr}.stats .bal{grid-column:1/-1}h1{font-size:1.3rem}.stat b{font-size:1.3rem}}
</style>
</head>
<body>
<div class="app">
  <aside><div class="brand"><span>👛</span><b>Personal<br>Money Manager</b></div><nav id="nav"></nav></aside>
  <main>
    <header>
      <div><h1 id="hi"></h1><p>Take control of your money, one step at a time.</p></div>
      <div class="hr"><input type="month" id="month" aria-label="Month"><button id="cats" aria-label="Manage categories">🏷️</button><button id="exp">⬇ CSV</button><button id="out">🚪 Log out</button></div>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="auth"><div class="card"><div class="brand"><span>👛</span><b>Personal Money Manager</b></div>
<label id="a-nw">Your name<input id="a-name" maxlength="30" autocomplete="name"></label>
<label>Email<input id="a-email" type="email" autocomplete="email" inputmode="email"></label>
<label>Password<input id="a-pw" type="password" autocomplete="current-password"></label>
<p id="a-msg" role="alert"></p><button class="pri" id="a-go">Log in</button>
<p class="mu" id="a-note">Your entries are saved online in your account. The site admin can view them.</p>
<p><button class="lnk" id="a-sw"></button> · <button class="lnk" id="a-fp">Forgot password?</button></p></div></div>
<dialog id="dlg"></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* 2. SETTINGS: your name now comes from your account */
let NAME='';

/* 3. DATA: everything lives in S and is saved online in your own account */
let S={tx:[],loans:[]}, USER=null, pendingName='', st;
const save=()=>{clearTimeout(st);st=setTimeout(push,400)};

/* 4. HELPERS */
const $=id=>document.getElementById(id);
const iso=d=>d.toLocaleDateString('en-CA');
const today=()=>iso(new Date());
const fmt=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});
const sum=a=>a.reduce((s,t)=>s+t.amt,0);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DC={expense:{Food:'🍽️',Transport:'🚌',Shopping:'🛍️',Bills:'💡',Health:'💊',Fun:'🎬',Other:'📦'},income:{Salary:'💼',Business:'🏪',Freelance:'💻',Gift:'🎁',Other:'📦'}};
const fix=()=>{if(!Array.isArray(S.inv))S.inv=[];if(S.mbudget==null)S.mbudget=S.budget?Math.round(S.budget*30):3000;if(!S.cats||!S.cats.expense||!S.cats.income){const o=S.cats||{};S.cats={expense:o.expense||(Object.keys(o).length?o:DC.expense),income:o.income||DC.income}}};fix();
const ACCS={Cash:'💵',UPI:'📲',Wallet:'👛'};
const NAV=[['home','🏠','Home'],['reports','📊','Reports'],['savings','🐷','Savings',1],['invest','📈','Investments'],['borrowed','🤝','Borrowed'],['lent','🔁','Lend'],['remind','📅','Reminders',1]];
let view='home', ym=today().slice(0,7), sel=today(), rtab='daily';
const when=d=>d==today()?'Today':d==iso(new Date(Date.now()-864e5))?'Yesterday':d;
const acct=a=>sum(S.tx.filter(t=>t.acc==a&&t.type=='income'))-sum(S.tx.filter(t=>t.acc==a&&t.type=='expense'))+sum(S.tx.filter(t=>t.type=='transfer'&&t.to==a))-sum(S.tx.filter(t=>t.type=='transfer'&&t.from==a))-invFlow(a)+loanDelta(a);
const invFlow=a=>S.inv.reduce((q,i)=>q+i.flows.filter(f=>f.acc==a).reduce((r,f)=>r+f.amt,0),0);
const invAll=()=>S.inv.reduce((q,i)=>q+i.flows.reduce((r,f)=>r+f.amt,0),0);
const loanDelta=a=>S.loans.reduce((q,l)=>q+(l.fl||[]).filter(f=>!a||f.acc==a).reduce((r,f)=>r+f.d,0),0);

/* 5. SCREENS: each function returns HTML for one screen */
function cal(){
  const [y,m]=ym.split('-').map(Number), first=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate();
  let h='<div class="dow">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>'<span>'+d+'</span>').join('')+'</div><div class="days">'+'<i></i>'.repeat(first);
  for(let d=1;d<=days;d++){
    const ds=ym+'-'+String(d).padStart(2,'0'), ts=S.tx.filter(t=>t.date==ds);
    h+=`<button class="day${ds==sel?' sel':''}${ds==today()?' now':''}" data-d="${ds}">${d}<span>${ts.some(t=>t.type=='income')?'<b></b>':''}${ts.some(t=>t.type=='expense')?'<b class="r"></b>':''}</span></button>`;
  }
  return h+'</div>';
}
function home(){
  const mt=S.tx.filter(t=>t.date.startsWith(ym)),
    inc=sum(mt.filter(t=>t.type=='income')), out=sum(mt.filter(t=>t.type=='expense')),
    bal=sum(S.tx.filter(t=>t.type=='income'))-sum(S.tx.filter(t=>t.type=='expense'))-invAll()+loanDelta(),
    spent=sum(S.tx.filter(t=>t.date==sel&&t.type=='expense')), dbud=S.mbudget/new Date(+sel.slice(0,4),+sel.slice(5,7),0).getDate(), left=dbud-spent,
    pct=dbud>0?spent/dbud*100:(spent?100:0), cls=pct>100?'over':pct>=75?'warn':'',
    mspent=out, mleft=S.mbudget-mspent, mpct=S.mbudget>0?mspent/S.mbudget*100:(mspent?100:0), mcls=mpct>100?'over':mpct>=75?'warn':'',
    monthName=new Date(ym+'-01T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'}),
    rec=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,6),
    open=k=>S.loans.filter(l=>l.kind==k&&!l.done);
  const ival=S.inv.reduce((q,i)=>q+i.val,0), ipl=S.inv.reduce((q,i)=>q+i.val+i.out-i.put,0);
  const loanCard=(k,t)=>{const o=open(k),next=o.map(l=>l.due).sort()[0];return `<button data-a="nav" data-v="${k}"><small>${t}</small><b>${fmt(sum(o))}</b><small>${next?'Due: '+next:'Nothing open'}</small></button>`};
  return `<div class="stats">
    <div class="card stat bal"><small>Available Balance</small><b>${fmt(bal)}</b></div>
    <div class="card stat in"><small>This Month Income</small><b class="g">${fmt(inc)}</b></div>
    <div class="card stat out"><small>This Month Expenses</small><b class="r">${fmt(out)}</b></div></div>
  <div class="card bud ${cls}">
    <small class="mu">${sel==today()?'Today’s remaining budget':'Remaining budget for '+sel}</small>
    <div class="big">${left>=0?fmt(left)+' left':fmt(-left)+' over'}</div>
    <div class="bar" role="progressbar" aria-label="Daily budget used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(Math.min(pct,100))}"><i style="width:${Math.min(pct,100)}%"></i></div>
    <div class="meta"><span>Spent ${fmt(spent)} of ${fmt(dbud)} · ${Math.round(pct)}% used</span></div></div>
  <div class="card mon ${mcls}"><div class="meta"><span>This month: spent ${fmt(mspent)} of ${fmt(S.mbudget)}</span><b>${mleft>=0?fmt(mleft)+' left':fmt(-mleft)+' over'}</b></div><div class="bar" role="progressbar" aria-label="Monthly budget used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(Math.min(mpct,100))}"><i style="width:${Math.min(mpct,100)}%"></i></div><div class="meta"><label>Monthly budget ₹<input id="bud" type="number" min="0" step="1" inputmode="decimal" value="${S.mbudget}"></label><span>= ${fmt(dbud)} per day</span></div></div>
  <div class="cols"><div>
    <div class="card"><div class="hd"><h2>${monthName}</h2><span><button class="x" data-a="mprev" aria-label="Previous month">‹</button><button class="x" data-a="mnext" aria-label="Next month">›</button></span></div>${cal()}
      <div class="legend"><span class="g">●</span> Income <span class="r">●</span> Expense</div>
      <button class="pri" data-a="form" data-f="expense">+ Add Transaction</button></div>
    <div class="ll">${loanCard('borrowed','Borrowed Money')}${loanCard('lent','Lend Money')}</div></div>
  <div>
    <div class="acts"><button data-a="form" data-f="expense"><span>⬇️</span>Add Expense</button><button data-a="form" data-f="income"><span>⬆️</span>Add Income</button><button data-a="form" data-f="borrowed"><span>🤝</span>Borrowed Money</button><button data-a="form" data-f="lent"><span>🔁</span>Lend Money</button></div>
    <div class="card"><div class="hd"><h2>Money Overview</h2><button class="ghost sm" data-a="form" data-f="transfer">⇄ Move money</button></div><div class="ov">${Object.keys(ACCS).map(a=>`<div><span>${ACCS[a]}</span><small>${a}</small><b>${fmt(acct(a))}</b></div>`).join('')}</div>${S.inv.length?`<button class="ghost sm invln" data-a="nav" data-v="invest">📈 Investments worth ${fmt(ival)} (${ipl>=0?'+':'-'}${fmt(Math.abs(ipl))})</button>`:''}</div>
    <div class="card"><h2>Recent Transactions</h2>${rec.length?rec.map(t=>`<div class="tx"><span class="ic ${t.type}">${t.type=='income'?'⬆':t.type=='transfer'?'⇄':S.cats.expense[t.cat]||'📦'}</span><div><b>${esc(t.note||(t.type=='transfer'?t.acc:t.cat))}</b><small>${when(t.date)} • ${t.time||''}</small></div><span class="chip">${esc(t.cat)}</span><b class="${t.type=='income'?'g':t.type=='transfer'?'mu':'r'}">${t.type=='income'?'+':t.type=='transfer'?'':'-'}${fmt(t.amt)}</b><button class="x" data-a="del" data-id="${t.id}" aria-label="Delete">×</button></div>`).join(''):'<p class="mu">No transactions yet. Tap “Add Expense” to log your first one.</p>'}</div>
  </div></div>`;
}
const byCat=arr=>{const o={};arr.forEach(t=>o[t.cat]=(o[t.cat]||0)+t.amt);return Object.entries(o).sort((x,y)=>y[1]-x[1])};
const catHtml=(rows,type)=>{const tot=rows.reduce((q,r)=>q+r[1],0);return rows.length?rows.map(([c,v])=>`<div class="rep"><span>${S.cats[type][c]||''} ${esc(c)}</span><div class="bar"><i style="width:${v/tot*100}%"></i></div><b>${fmt(v)}</b></div>`).join(''):'<p class="mu">Nothing yet.</p>'};
const txRow=t=>`<div class="tx"><div><b>${esc(t.note||(t.type=='transfer'?t.acc:t.cat))}</b><small>${esc(t.cat)} • ${t.time||''}</small></div><b class="${t.type=='income'?'g':t.type=='transfer'?'mu':'r'}">${t.type=='income'?'+':t.type=='transfer'?'':'-'}${fmt(t.amt)}</b></div>`;
function reports(){
  const tab=(k,n)=>`<button class="${rtab==k?'pri':'ghost'}" data-a="rtab" data-t="${k}">${n}</button>`;
  return `<div class="tabs">${tab('daily','Daily')}${tab('monthly','Monthly')}</div>`+(rtab=='daily'?daily():monthly());
}
function daily(){
  const [y,m]=sel.split('-').map(Number), lim=S.mbudget/new Date(y,m,0).getDate(),
    dt=S.tx.filter(t=>t.date==sel), ex=dt.filter(t=>t.type=='expense'), inc=sum(dt.filter(t=>t.type=='income')), sp=sum(ex), left=lim-sp;
  return `<div class="card"><div class="hd"><button class="x" data-a="rday" data-n="-1" aria-label="Previous day">‹</button><input type="date" id="rday" value="${sel}" style="width:auto"><button class="x" data-a="rday" data-n="1" aria-label="Next day">›</button></div>
  <div class="stats2"><div><small>Spent</small><b class="r">${fmt(sp)}</b></div><div><small>Income</small><b class="g">${fmt(inc)}</b></div><div><small>Daily limit</small><b>${fmt(lim)}</b></div><div><small>${left>=0?'Left today':'Over by'}</small><b class="${left>=0?'g':'r'}">${fmt(Math.abs(left))}</b></div></div></div>
  <div class="card"><h2>Spending by category</h2>${catHtml(byCat(ex),'expense')}</div>
  <div class="card"><h2>Entries</h2>${dt.length?dt.map(txRow).join(''):'<p class="mu">No entries for this day.</p>'}</div>`;
}
function monthly(){
  const [y,m]=ym.split('-').map(Number), dim=new Date(y,m,0).getDate(), lim=S.mbudget/dim,
    mt=S.tx.filter(t=>t.date.startsWith(ym)), ex=mt.filter(t=>t.type=='expense'), ic=mt.filter(t=>t.type=='income'),
    inc=sum(ic), out=sum(ex), net=inc-out, pct=S.mbudget>0?out/S.mbudget*100:(out?100:0),
    name=k=>new Date(k+'-01T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'}),
    per=Array.from({length:dim},(_,i)=>sum(ex.filter(t=>t.date==ym+'-'+String(i+1).padStart(2,'0')))), mx=Math.max(lim,...per,1), months={};
  S.tx.forEach(t=>{if(t.type=='transfer')return;const o=months[t.date.slice(0,7)]||(months[t.date.slice(0,7)]={i:0,e:0});o[t.type=='income'?'i':'e']+=t.amt});
  const ml=Object.keys(months).sort().reverse().slice(0,12);
  return `<div class="card"><h2>${name(ym)}</h2><div class="stats2"><div><small>Income</small><b class="g">${fmt(inc)}</b></div><div><small>Expenses</small><b class="r">${fmt(out)}</b></div><div><small>Saved</small><b class="${net>=0?'g':'r'}">${fmt(net)}</b></div><div><small>Budget used</small><b>${Math.round(pct)}%</b></div></div></div>
  <div class="card"><h2>Spending by day</h2><div class="chart">${per.map((v,i)=>`<i class="${v>lim?'o':''}" style="height:${v/mx*100}%" title="Day ${i+1}: ${fmt(v)}"></i>`).join('')}<u style="bottom:${lim/mx*100}%"></u></div><div class="mu cap">Dashed line = daily limit (${fmt(lim)}). Red bars went over it.</div></div>
  <div class="card"><h2>Spending by category</h2>${catHtml(byCat(ex),'expense')}</div>
  <div class="card"><h2>Income by category</h2>${catHtml(byCat(ic),'income')}</div>
  <div class="card"><h2>All months</h2>${ml.length?ml.map(k=>`<div class="tx"><div><b>${name(k)}</b><small>Income ${fmt(months[k].i)} · Expenses ${fmt(months[k].e)}</small></div><b class="${months[k].i-months[k].e>=0?'g':'r'}">${fmt(months[k].i-months[k].e)}</b></div>`).join(''):'<p class="mu">No data yet.</p>'}</div>`;
}
function invest(){
  const pl=i=>i.val+i.out-i.put, sg=v=>(v>=0?'+':'-')+fmt(Math.abs(v)), sm=f=>S.inv.reduce((q,i)=>q+f(i),0), tp=sm(pl);
  return `<div class="card"><div class="hd"><h2>Investments</h2><button class="pri sm" data-a="form" data-f="invnew">+ New</button></div>
  <div class="stats2"><div><small>Put in</small><b>${fmt(sm(i=>i.put))}</b></div><div><small>Worth now</small><b>${fmt(sm(i=>i.val))}</b></div><div><small>Profit / loss</small><b class="${tp>=0?'g':'r'}">${sg(tp)}</b></div></div></div>`+
  (S.inv.length?S.inv.map(i=>`<div class="card"><div class="hd"><b>${esc(i.name)}</b><button class="x" data-a="invdel" data-id="${i.id}" aria-label="Delete investment">×</button></div>
  <div class="stats2"><div><small>Put in</small><b>${fmt(i.put)}</b></div><div><small>Worth now</small><b>${fmt(i.val)}</b></div><div><small>Profit / loss</small><b class="${pl(i)>=0?'g':'r'}">${sg(pl(i))} (${(i.put>0?pl(i)/i.put*100:0).toFixed(1)}%)</b></div></div>
  <div class="acts3"><button class="ghost sm" data-a="form" data-f="invval" data-id="${i.id}">Update value</button><button class="ghost sm" data-a="form" data-f="invadd" data-id="${i.id}">Add money</button><button class="ghost sm" data-a="form" data-f="invout" data-id="${i.id}">Withdraw</button></div></div>`).join(''):'<div class="card"><p class="mu">No investments yet. Tap “+ New” to add one, for example your trading money.</p></div>');
}
function openInv(kind,id){
  const v=S.inv.find(i=>i.id===id), opts=o=>Object.keys(o).map(k=>`<option>${k}</option>`).join(''),
    T={invnew:'New investment',invadd:'Add money',invout:'Withdraw money',invval:'Update value'}[kind]+(v?' · '+esc(v.name):'');
  $('dlg').dataset.id=id||'';
  const amt=l=>`<label>${l}<input id="f-amt" type="number" min="0" step="0.01" inputmode="decimal" value="${kind=='invval'?v.val:''}"></label>`,
    acc=l=>`<label>${l}<select id="f-acc">${opts(ACCS)}</select></label>`, date=`<label>Date<input id="f-date" type="date" value="${sel}"></label>`;
  $('dlg').innerHTML=`<h2>${T}</h2>`+(kind=='invnew'?`<label>Name<input id="f-name" maxlength="40" placeholder="e.g. Trading account"></label>`+amt('Amount put in (₹)')+acc('Paid from'):kind=='invval'?amt('Worth now (₹)'):kind=='invadd'?amt('Amount to add (₹)')+acc('Paid from'):amt('Amount to withdraw (₹)')+acc('Send to'))+(kind=='invval'?'':date)+`<p id="f-err" role="alert"></p><div class="row"><button class="ghost" data-a="close">Cancel</button><button class="pri" data-a="save" data-f="${kind}">Save</button></div>`;
  $('dlg').showModal();
}
function submitInv(kind){
  const id=+$('dlg').dataset.id, v=S.inv.find(i=>i.id===id), amt=parseFloat($('f-amt').value), err=m=>{$('f-err').textContent=m};
  if(kind=='invval'){if(!(amt>=0)||!v)return err('Enter the current value.');v.val=amt}
  else{
    if(!(amt>0))return err('Enter an amount greater than zero.');
    const date=$('f-date').value||today(), acc=$('f-acc').value;
    if(kind=='invnew'){const name=$('f-name').value.trim();if(!name)return err('Enter a name.');S.inv.push({id:Date.now(),name,put:amt,out:0,val:amt,flows:[{id:Date.now()+1,date,acc,amt}]})}
    else if(v){
      if(kind=='invadd'){v.put+=amt;v.val+=amt;v.flows.push({id:Date.now(),date,acc,amt})}
      else{v.out+=amt;v.val=Math.max(0,v.val-amt);v.flows.push({id:Date.now(),date,acc,amt:-amt})}
    }
  }
  save();$('dlg').close();render();
}
function loans(kind){
  const L=S.loans.filter(l=>l.kind==kind);
  return `<div class="card"><div class="hd"><h2>${kind=='lent'?'Lend Money':'Borrowed Money'}</h2><button class="pri sm" data-a="form" data-f="${kind}">+ Add</button></div>`+
  (L.length?L.map(l=>`<div class="row2"><div class="${l.done?'done':''}"><b>${esc(l.who)}</b><small>Due ${esc(l.due)}${(l.fl||[]).map(f=>' · '+(f.d>0?'+':'-')+fmt(Math.abs(f.d))+' '+esc(f.acc)).join('')}</small></div><b class="${l.done?'done':''}">${fmt(l.amt)}</b><button class="ghost sm" data-a="settle" data-id="${l.id}">${l.done?'Reopen':'Settle'}</button><button class="x" data-a="delloan" data-id="${l.id}" aria-label="Delete">×</button></div>`).join(''):'<p class="mu">Nothing here yet. Tap “Add” to record one.</p>')+'</div>';
}

/* 6. THE ADD FORM (one pop-up used for all four buttons) */
function openForm(kind,id){
  if(kind.startsWith('inv'))return openInv(kind,id);
  const loan=kind=='borrowed'||kind=='lent', title={expense:'Add Expense',income:'Add Income',borrowed:'Borrowed Money',lent:'Lend Money',transfer:'Move Money'}[kind];
  const opts=o=>Object.keys(o).map(k=>`<option>${k}</option>`).join('');
  $('dlg').innerHTML=`<h2>${title}</h2><label>Amount (₹)<input id="f-amt" type="number" min="0" step="0.01" inputmode="decimal"></label>`+
  (kind=='transfer'?`<label>From<select id="f-from">${opts(ACCS)}</select></label><label>To<select id="f-to">${opts(ACCS)}</select></label><label>Note (optional)<input id="f-note" maxlength="60"></label><label>Date<input id="f-date" type="date" value="${sel}"></label>`:loan?`<label>${kind=='lent'?'Lend to':'Borrowed from'}<input id="f-who" maxlength="40"></label><label>Due date<input id="f-date" type="date" value="${sel}"></label><label class="chk"><input type="checkbox" id="f-link" checked>${kind=='lent'?'Take this money from my account':'Add this money to my account'}</label><label>Account<select id="f-acc">${opts(ACCS)}</select></label>`
  :`<label>Category<select id="f-cat">${opts(S.cats[kind])}</select></label><button class="ghost sm" data-a="cats" data-t="${kind}">Edit ${kind} categories</button><label>Account<select id="f-acc">${opts(ACCS)}</select></label><label>Note (optional)<input id="f-note" maxlength="60"></label><label>Date<input id="f-date" type="date" value="${sel}"></label>`)+
  `<p id="f-err" role="alert"></p><div class="row"><button class="ghost" data-a="close">Cancel</button><button class="pri" data-a="save" data-f="${kind}">Save</button></div>`;
    if(kind=='transfer')$('f-to').selectedIndex=1;
  $('dlg').showModal();
}
function openSettle(l){
  const b=l.kind=='borrowed'; $('dlg').dataset.id=l.id;
  $('dlg').innerHTML=`<h2>Settle · ${esc(l.who)}</h2><p class="mu">${b?'You repay':'You get back'} ${fmt(l.amt)}</p><label class="chk"><input type="checkbox" id="f-link" checked>${b?'Take the repayment from my account':'Add the money to my account'}</label><label>Account<select id="f-acc">${Object.keys(ACCS).map(k=>`<option>${k}</option>`).join('')}</select></label><div class="row"><button class="ghost" data-a="close">Cancel</button><button class="pri" data-a="save" data-f="settle">Settle</button></div>`;
  $('dlg').showModal();
}
function submitSettle(){
  const l=S.loans.find(x=>x.id===+$('dlg').dataset.id); if(!l)return;
  l.done=true; l.fl=(l.fl||[]).filter(f=>!f.s);
  if($('f-link').checked)l.fl.push({acc:$('f-acc').value,d:l.kind=='borrowed'?-l.amt:l.amt,s:1});
  save();$('dlg').close();render();
}
function submit(kind){
  if(kind=='settle')return submitSettle();
  if(kind.startsWith('inv'))return submitInv(kind);
  const amt=parseFloat($('f-amt').value), date=$('f-date').value||today(), err=m=>{$('f-err').textContent=m};
  if(!(amt>0))return err('Enter an amount greater than zero.');
  if(kind=='borrowed'||kind=='lent'){
    const who=$('f-who').value.trim(); if(!who)return err('Enter a name.');
    const ln={id:Date.now(),kind,who,amt,due:date,done:false};
    if($('f-link').checked)ln.fl=[{acc:$('f-acc').value,d:kind=='borrowed'?amt:-amt}];
    S.loans.push(ln);
  }else if(kind=='transfer'){
    const f=$('f-from').value, to=$('f-to').value; if(f==to)return err('Choose two different accounts.');
    S.tx.push({id:Date.now(),type:'transfer',amt,from:f,to:to,cat:'Transfer',acc:f+' → '+to,note:$('f-note').value.trim(),date,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
    sel=date; ym=date.slice(0,7);
  }else{
    S.tx.push({id:Date.now(),type:kind,amt,cat:$('f-cat').value,acc:$('f-acc').value,note:$('f-note').value.trim(),date,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
    sel=date; ym=date.slice(0,7);
  }
  save(); $('dlg').close(); render();
}

/* 6b. CATEGORY EDITOR: add, rename or delete categories */
function crow(e,n,o){return `<div class="crow" data-old="${esc(o)}"><input class="ce" value="${esc(e)}" maxlength="4" aria-label="Emoji"><input class="cn" value="${esc(n)}" maxlength="20" aria-label="Category name"><button class="x" data-a="catdel" aria-label="Delete category">×</button></div>`}
function openCats(t){
  t=t||'expense'; $('dlg').dataset.t=t; const c=S.cats[t], tab=k=>`<button class="${t==k?'pri':'ghost'}" data-a="cats" data-t="${k}">${k=='expense'?'Expense':'Income'}</button>`;
  $('dlg').innerHTML='<h2>Categories</h2><div class="row" style="margin-bottom:8px">'+tab('expense')+tab('income')+'</div><div id="clist">'+Object.keys(c).map(k=>crow(c[k],k,k)).join('')+'</div><button class="ghost" data-a="catadd" style="width:100%;margin-top:8px">+ New category</button><p id="f-err" role="alert"></p><div class="row"><button class="ghost" data-a="close">Cancel</button><button class="pri" data-a="catsave">Save</button></div>';
  if(!$('dlg').open)$('dlg').showModal();
}
function saveCats(){
  const t=$('dlg').dataset.t, nc={}, ren={};
  for(const r of document.querySelectorAll('#clist .crow')){
    const n=r.querySelector('.cn').value.trim(), e=r.querySelector('.ce').value.trim()||'📦', o=r.dataset.old;
    if(!n)continue;
    if(nc[n]){$('f-err').textContent='Two categories are named “'+n+'”. Rename one.';return}
    nc[n]=e; if(o&&o!==n)ren[o]=n;
  }
  if(!Object.keys(nc).length){$('f-err').textContent='Keep at least one category.';return}
  S.tx.forEach(x=>{if(x.type==t&&ren[x.cat])x.cat=ren[x.cat]});
  S.cats[t]=nc; save(); $('dlg').close(); render();
}
$('cats').onclick=()=>openCats('expense');

/* 7. CSV EXPORT */
function csv(){
  const c=v=>{v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  return ['Date,Time,Type,Category,Account,Note,Amount'].concat([...S.tx].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id).map(t=>[t.date,t.time||'',t.type,t.cat,t.acc,t.note,t.amt.toFixed(2)].map(c).join(','))).join('\r\n');
}
$('exp').onclick=()=>{
  if(!S.tx.length)return alert('No transactions to export yet.');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv()],{type:'text/csv'}));
  a.download='money-manager-'+today()+'.csv'; a.click();
};

/* 8. DRAW THE PAGE */
function render(){
  const h=new Date().getHours();
  $('hi').textContent=(h<12?'Good Morning':h<17?'Good Afternoon':'Good Evening')+', '+NAME+'!';
  $('month').value=ym;
  $('nav').innerHTML=NAV.map(n=>`<button class="${n[0]==view?'on ':''}${n[3]?'soon':''}" data-a="nav" data-v="${n[0]}">${n[1]}<span>${n[2]}</span></button>`).join('')+(isAdmin()?'<button onclick="location.href=\'admin.html\'">⚙️<span>Admin</span></button>':'');
  const soon=NAV.find(n=>n[0]==view);
  $('view').innerHTML=view=='home'?home():view=='reports'?reports():view=='invest'?invest():(view=='borrowed'||view=='lent')?loans(view):`<div class="card"><h2>${soon[2]}</h2><p class="mu">This section is coming in a later step.</p></div>`;
}

/* 9. TAPS AND CLICKS */
document.addEventListener('click',e=>{
  const d=e.target.closest('[data-d]'); if(d){sel=d.dataset.d;return render()}
  const b=e.target.closest('[data-a]'); if(!b)return;
  const a=b.dataset.a, id=+b.dataset.id;
  if(a=='cats')return openCats(b.dataset.t);
  if(a=='catadd')return $('clist').insertAdjacentHTML('beforeend',crow('📦','',''));
  if(a=='catdel')return b.closest('.crow').remove();
  if(a=='catsave')return saveCats();
  if(a=='form')return openForm(b.dataset.f,id);
  if(a=='close')return $('dlg').close();
  if(a=='save')return submit(b.dataset.f);
  if(a=='nav')view=b.dataset.v;
  else if(a=='rtab')rtab=b.dataset.t;
  else if(a=='invdel'){if(!confirm('Delete this investment? The money you moved will be added back to your account balances.'))return;S.inv=S.inv.filter(i=>i.id!==id);save()}
  else if(a=='rday'){const d=new Date(sel+'T12:00:00');d.setDate(d.getDate()+Number(b.dataset.n));sel=iso(d);ym=sel.slice(0,7)}
  else if(a=='mprev'||a=='mnext'){const [y,m]=ym.split('-').map(Number);ym=iso(new Date(y,m-1+(a=='mnext'?1:-1),1)).slice(0,7)}
  else if(a=='del'){S.tx=S.tx.filter(t=>t.id!==id);save()}
  else if(a=='delloan'){const l=S.loans.find(l=>l.id===id);if(l&&(l.fl||[]).length&&!confirm('Delete this record? Its effect on your account balances will be reversed.'))return;S.loans=S.loans.filter(l=>l.id!==id);save()}
  else if(a=='settle'){const l=S.loans.find(l=>l.id===id);if(!l)return;if(l.done){l.done=false;l.fl=(l.fl||[]).filter(f=>!f.s);save()}else return openSettle(l)}
  render();
});
document.addEventListener('change',e=>{
  if(e.target.id=='bud'){S.mbudget=Math.max(0,parseFloat(e.target.value)||0);save();render()}
  if(e.target.id=='rday'&&e.target.value){sel=e.target.value;ym=sel.slice(0,7);render()}
  if(e.target.id=='month'&&e.target.value){ym=e.target.value;if(!sel.startsWith(ym))sel=ym==today().slice(0,7)?today():ym+'-01';render()}
});
/* 10. LOGIN + ONLINE SAVING (Firebase) */
const isAdmin=()=>!!(USER&&window.ADMIN_EMAIL&&USER.email&&USER.email.toLowerCase()==ADMIN_EMAIL.toLowerCase());
let auth,db,mode='in';
const amsg=t=>{$('a-msg').textContent=t};
const errText=e=>({'auth/invalid-credential':'Wrong email or password.','auth/invalid-login-credentials':'Wrong email or password.','auth/wrong-password':'Wrong email or password.','auth/user-not-found':'Wrong email or password.','auth/email-already-in-use':'That email already has an account. Log in instead.','auth/weak-password':'Use a password with at least 6 characters.','auth/invalid-email':'That email doesn’t look right.','auth/network-request-failed':'No internet connection.','auth/too-many-requests':'Too many tries. Wait a bit and try again.'}[e.code]||'Something went wrong ('+e.code+').');
function authUI(){$('a-nw').style.display=$('a-note').style.display=mode=='up'?'block':'none';$('a-go').textContent=mode=='up'?'Create account':'Log in';$('a-sw').textContent=mode=='up'?'Have an account? Log in':'New here? Create an account'}
function push(){
  if(!USER)return;
  return db.collection('users').doc(USER.uid).set({name:NAME,email:USER.email,updated:firebase.firestore.FieldValue.serverTimestamp(),data:JSON.stringify(S)},{merge:true}).catch(()=>alert('Could not save. Check your internet.'));
}
async function boot(u){
  USER=u;
  if(!u){S={tx:[],loans:[]};fix();NAME='';$('auth').classList.remove('off');authUI();return}
  try{
    const ref=db.collection('users').doc(u.uid), d=await ref.get(), x=d.exists?d.data():{};
    S=Object.assign({tx:[],loans:[]},x.data?JSON.parse(x.data):{}); fix();
    NAME=x.name||pendingName||u.email.split('@')[0]; pendingName='';
    if(!d.exists)await ref.set({name:NAME,email:u.email,created:firebase.firestore.FieldValue.serverTimestamp(),updated:firebase.firestore.FieldValue.serverTimestamp(),data:JSON.stringify(S)});
    $('auth').classList.add('off'); view='home'; render();
  }catch(e){amsg(e.code=='permission-denied'?'Access denied. This account may have been removed by the admin.':'Could not load your data ('+(e.code||'error')+').');auth.signOut()}
}
if(!window.FIREBASE_CONFIG||/PASTE/.test(FIREBASE_CONFIG.apiKey)){amsg('Firebase isn’t set up yet. Paste your config into firebase-config.js.')}
else{
  firebase.initializeApp(FIREBASE_CONFIG); auth=firebase.auth(); db=firebase.firestore();
  $('a-go').onclick=async()=>{
    const em=$('a-email').value.trim(), pw=$('a-pw').value, nm=$('a-name').value.trim(); amsg('');
    if(!em||!pw)return amsg('Enter your email and password.');
    if(mode=='up'&&!nm)return amsg('Enter your name.');
    try{if(mode=='up'){pendingName=nm;await auth.createUserWithEmailAndPassword(em,pw)}else await auth.signInWithEmailAndPassword(em,pw)}catch(e){pendingName='';amsg(errText(e))}
  };
  $('a-sw').onclick=()=>{mode=mode=='up'?'in':'up';amsg('');authUI()};
  $('a-fp').onclick=async()=>{const em=$('a-email').value.trim();if(!em)return amsg('Type your email first.');try{await auth.sendPasswordResetEmail(em);amsg('Reset link sent. Check your email.')}catch(e){amsg(errText(e))}};
  $('out').onclick=()=>auth.signOut();
  auth.onAuthStateChanged(boot);
}
authUI();
render();
</script>
</body>
</html>
